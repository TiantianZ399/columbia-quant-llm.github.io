<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CQLLM Light Up</title>
<style>
:root{--blue:#0055b8;--bg:#05070c;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--white)}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 34%,rgba(0,85,184,.22),transparent 34%),#05070c}
.page{position:relative;z-index:2;width:100%;height:100svh;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.stage{width:min(74vw,74vh,560px);max-width:560px;position:relative;display:flex;flex-direction:column;align-items:center}
.logo-wrap{position:relative;width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.logo{width:100%;height:100%;object-fit:contain;filter:brightness(.98) contrast(1.05) drop-shadow(0 0 18px rgba(255,255,255,.13));transition:filter 1.1s ease,transform 1.1s ease}
.crown-glow{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;clip-path:polygon(20% 0%,80% 0%,80% 43%,20% 43%);opacity:0;filter:brightness(1.7) saturate(1.7) drop-shadow(0 0 12px rgba(0,85,184,1)) drop-shadow(0 0 34px rgba(0,85,184,.9)) drop-shadow(0 0 74px rgba(0,85,184,.55));transition:opacity 1.2s ease;pointer-events:none}
.lit .logo{filter:brightness(1.06) contrast(1.1) drop-shadow(0 0 22px rgba(255,255,255,.27));transform:scale(1.012)}
.lit .crown-glow{opacity:1;animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.82}50%{opacity:1}}
.button{margin-top:26px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.07);color:white;border-radius:999px;padding:12px 28px;min-width:142px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px);transition:background .25s ease,border-color .25s ease,transform .25s ease}
.button:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.46)}
.button:active{transform:scale(.98)}
.button[disabled]{opacity:.55;cursor:default}
.status{margin-top:18px;min-height:32px;font-size:15px;color:rgba(255,255,255,.68)}
.countdown{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;font-size:min(34vw,34vh);font-weight:300;letter-spacing:-.08em;color:white;text-shadow:0 0 20px rgba(255,255,255,.55),0 0 60px rgba(0,85,184,.7);transition:opacity .2s ease}
.countdown.show{opacity:1}
.topline{position:fixed;top:18px;left:22px;z-index:3;font-size:13px;color:rgba(255,255,255,.55)}
.bottomline{position:fixed;bottom:18px;left:22px;right:22px;z-index:3;display:flex;justify-content:space-between;gap:16px;font-size:12px;color:rgba(255,255,255,.45)}
.flash{position:fixed;inset:0;z-index:4;background:radial-gradient(circle at 50% 30%,rgba(0,85,184,.75),transparent 34%);opacity:0;pointer-events:none}
.flash.on{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:.9}100%{opacity:0}}
@media(max-width:700px){.stage{width:min(88vw,76vh)}.button{margin-top:18px}.topline{left:16px;top:14px}.bottomline{left:16px;right:16px;bottom:14px;font-size:11px}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="topline">CQLLM Light Up</div>
<main class="page">
  <div class="stage" id="stage">
    <div class="logo-wrap">
      <img class="logo" src="logo.png" alt="Columbia Quant LLM logo">
      <img class="crown-glow" src="logo.png" alt="">
    </div>
    <button class="button" id="lightButton">Light Up</button>
    <div class="status" id="status">Press the button to light the crown.</div>
  </div>
</main>
<div class="countdown" id="countdown">3</div>
<div class="flash" id="flash"></div>
<div class="bottomline">
  <span>Open this page on any phone or iPad.</span>
  <span>Share the GitHub Pages URL with everyone.</span>
</div>
<script>
const button=document.getElementById("lightButton");
const statusText=document.getElementById("status");
const countdown=document.getElementById("countdown");
const stage=document.getElementById("stage");
const flash=document.getElementById("flash");
let lit=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function lightUp(){
  if(lit)return;
  lit=true;
  button.disabled=true;
  statusText.textContent="Lighting in...";
  for(const n of [3,2,1]){
    countdown.textContent=n;
    countdown.classList.add("show");
    await sleep(720);
    countdown.classList.remove("show");
    await sleep(250);
  }
  stage.classList.add("lit");
  flash.classList.add("on");
  statusText.textContent="The crown is lit.";
  setTimeout(()=>flash.classList.remove("on"),1000);
}
button.addEventListener("click",lightUp);
</script>
</body>
</html>
